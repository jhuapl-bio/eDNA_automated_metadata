<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #map {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const samples = <?!= samplesJson ?>;

      const street = L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }
      );

      const ocean = L.tileLayer(
        'https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',
        {
          attribution: 'Tiles &copy; Esri'
        }
      );

      const oceanRef = L.tileLayer(
        'https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',
        {
          attribution: 'Labels &copy; Esri'
        }
      );

      const map = L.map('map', {
        layers: [ocean, oceanRef]
      });

      L.control.layers(
        {
          'Ocean Bathymetry': ocean,
          'Street Map': street
        },
        {
          'Ocean Labels': oceanRef
        }
      ).addTo(map);

      const bounds = [];

      samples.forEach(sample => {
        const lat = Number(sample.lat);
        const lng = Number(sample.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        L.circleMarker([lat, lng], {
          radius: 14,
          color: '#ff3b30',
          weight: 1,
          opacity: 0.3,
          fillColor: '#ff3b30',
          fillOpacity: 0.15
        }).addTo(map);

        const marker = L.circleMarker([lat, lng], {
          radius: 8,
          color: '#7f0000',
          weight: 2,
          fillColor: '#ff3b30',
          fillOpacity: 0.95
        }).addTo(map);
        marker.bindPopup(
          `<b>${escapeHtml(sample.label)}</b><br>` +
          `Row ${sample.row}<br>` +
          `${lat}, ${lng}`
        );

        bounds.push([lat, lng]);
      });

      if (bounds.length === 1) {
        map.setView(bounds[0], 10);
      } else if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [20, 20] });
      } else {
        map.setView([0, 0], 2);
      }

      setTimeout(() => {
        map.invalidateSize();
      }, 200);

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    </script>
  </body>
</html>
